name: 🧩 配方失效 / Recipe broken
description: 某个配方在网站上跑不通了（网站改版、定位器失效等）。
labels: ["recipe", "triage"]
body:
  - type: input
    id: recipe
    attributes:
      label: 配方 / Recipe
      placeholder: x.com/search-read-posts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 配方版本 / Recipe version
      description: 配方 JSON 里的 "version" 字段
    validations:
      required: true
  - type: textarea
    id: heal
    attributes:
      label: 现场档案 / `browser-recipewright heal <runDir>` output
      description: 请删掉账号名、帖子作者、个人数据。截图如含隐私请勿上传。
      render: json
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 失败类型 / Failure kind
      options:
        - 找不到元素 / locator not found
        - 数据为空或错位 / empty or wrong data
        - 卡在登录或验证码 / stuck at login or captcha
        - 其他 / other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充 / Notes
